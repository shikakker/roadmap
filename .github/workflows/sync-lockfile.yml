name: Sync pnpm lockfile

on:
  push:
    branches: [portfolio-improvements-2026-08]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'build: sync pnpm lockfile') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-improvements-2026-08
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: node --test tests/*.test.mjs
      - name: Regenerate lockfile with pinned pnpm
        run: pnpm install --no-frozen-lockfile
      - name: Verify synchronized dependency state
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
      - name: Commit verified lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already synchronized'
            exit 0
          fi
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add pnpm-lock.yaml
          git commit -m 'build: sync pnpm lockfile'
          git push origin HEAD:portfolio-improvements-2026-08
